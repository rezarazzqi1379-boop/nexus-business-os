name: Source monitor acceptance
on:
  pull_request:
    paths:
      - 'source_monitor.py'
      - 'tests/test_source_monitor.py'
      - 'tests/test_monitor_changes.py'
      - 'benchmark_source_monitor.py'
      - 'nexus_commercial_pilot.py'
      - 'nexus_connector_control_plane.py'
      - 'nexus_router_runtime.py'
      - '.github/workflows/source-monitor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - run: python -m pytest -q -p no:cacheprovider tests/test_source_monitor.py tests/test_monitor_changes.py tests/test_commercial_pilot.py
      - run: python benchmark_source_monitor.py
