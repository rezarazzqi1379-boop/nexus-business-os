name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.116,<1" "uvicorn[standard]>=0.35,<1" "pytest>=8,<9" "httpx>=0.28,<1"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run canonical unittest suite
        run: python -m unittest discover -s evals -v

      - name: Run pytest-style eval suites and NEXUS failure-derived checks (FM-005..FM-008, FM-011)
        # `unittest discover -s evals` collects only TestCase classes; 18 eval files
        # (402 tests, all steel engineering models among them) are plain pytest functions
        # and never ran in CI before (test_nexus_checks.py already ran here by name).
        # Running the whole evals/ tree under pytest covers them; the TestCase suites
        # run a second time, which costs about 8 s.
        run: |
          pytest -q -p no:cacheprovider evals
          if [ -d docs/procurement ]; then
            python -m nexus_checks docs/procurement --exclude '*_2026-09-22.md'
          fi

      - name: NEXUS synthetic cloud health smoke and negative injection
        run: |
          python - <<'PY'
          from nexus_lab_health import LabHealth, evaluate_lab_health, self_test
          from nexus_windows_lab_readiness import WindowsLabReadiness, readiness_errors
          report = self_test()
          assert report == {
              "ci_checks_passed": True,
              "local_install_verified": False,
              "persistent_service_verified": False,
              "production_ready": False,
          }, report
          failed = evaluate_lab_health(LabHealth(False, True))
          assert failed["ci_checks_passed"] is False
          assert failed["production_ready"] is False
          assert len(readiness_errors(WindowsLabReadiness())) == 10
          print("SYNTHETIC_CLOUD_SMOKE_PASS; NEGATIVE_INJECTION_PASS; NO_PRODUCTION_CLAIM")
          PY

      - name: Run pytest regression suite
        env:
          PYTHONPATH: src
        run: pytest -q tests
