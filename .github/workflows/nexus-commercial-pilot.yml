name: NEXUS Commercial Read-only Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nexus_commercial_pilot.py'
      - 'tests/test_commercial_pilot.py'
      - '.github/workflows/nexus-commercial-pilot.yml'

permissions:
  contents: read

concurrency:
  group: nexus-commercial-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commercial-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Focused acceptance tests
        run: python -m pytest -q tests/test_commercial_pilot.py tests/test_router_runtime.py tests/test_public_research_agent.py tests/test_free_research.py
      - name: Read one bounded real-source sample
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s python nexus_commercial_pilot.py --output "$RUNNER_TEMP/commercial-pilot" --commit-sha "$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nexus_commercial_pilot import assess, management_report, SOURCE
          import hashlib
          root = Path(os.environ['RUNNER_TEMP']) / 'commercial-pilot'
          summary = json.loads((root / 'summary.json').read_text())
          body = (root / 'public-source.json').read_bytes()
          assert summary['source_mode'] == 'REAL_PUBLIC_HTTP'
          assert summary['status'] == 'VERIFIED' and summary['http_requests'] == 1
          assert summary['supervisor'] == 'accepted' and summary['checkpoint_integrity']
          assert summary['duplicate_execution_prevented']
          assert summary['source_url'] == SOURCE and hashlib.sha256(body).hexdigest() == summary['source_sha256']
          assert summary['records_received'] > 0
          for key, value in assess(body, summary['source_retrieved_at']).items():
              assert summary[key] == value
          assert summary['authority_status'] == 'HOLD' and summary['external_writes'] == 0
          assert (root / 'management-fa.md').read_text() == management_report(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write((root / 'management-fa.md').read_text())
          print(json.dumps({key: summary[key] for key in ('commit_sha', 'opportunities_discovered',
              'opportunities_verified', 'opportunities_rejected', 'duplicates_removed',
              'actionable_opportunities', 'evidence_completeness', 'http_requests',
              'execution_duration_seconds', 'failure_categories')}))
          PY
      - name: Preserve safe public metadata and aggregate reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-pilot-evidence
          path: |
            ${{ runner.temp }}/commercial-pilot/summary.json
            ${{ runner.temp }}/commercial-pilot/management-fa.md
            ${{ runner.temp }}/commercial-pilot/public-source.json
          retention-days: 7
          if-no-files-found: ignore
