[project]
name = "nexus-autopilot"
version = "2.0.0rc2"
description = "Approval-gated autonomous project operator for NEXUS"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
