name: NEXUS Free Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nexus-free-runtime.yml'
      - 'nexus_free_research.py'
      - 'nexus_public_research_agent.py'
      - 'nexus_router_runtime.py'
      - 'tests/test_free_research.py'
  schedule:
    - cron: "17 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nexus-free-runtime
  cancel-in-progress: false

jobs:
  activation-smoke:
    name: Bounded activation and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NEXUS_AUTH_REQUIRED: "1"
      NEXUS_ACCESS_TOKEN: "github-actions-sandbox-token-not-for-production-123456789"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and smoke dependencies
        run: python -m pip install "fastapi>=0.116,<1" "uvicorn[standard]>=0.35,<1" "httpx>=0.28,<1"
      - name: Compile startup and API modules
        run: python -m py_compile start.py api.py security.py
      - name: Start isolated service and probe readiness
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_STATE_DB="$RUNNER_TEMP/state.db"
          export NEXUS_CANONICAL_DB="$RUNNER_TEMP/canonical.db"
          export NEXUS_VAULT_ROOT="$RUNNER_TEMP/vault"
          export NEXUS_CANONICAL_SOURCE_DIR="$GITHUB_WORKSPACE/canonical_source_files"
          export PORT=8421
          export NEXUS_DATA_DIR="$RUNNER_TEMP"
          python start.py > "$RUNNER_TEMP/nexus-startup.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, os
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8421"
          for attempt in range(35):
              try:
                  with urllib.request.urlopen(base + "/ready", timeout=2) as response:
                      assert response.status == 200
                      break
              except (urllib.error.URLError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit("NEXUS failed readiness within 35 seconds")

          with urllib.request.urlopen(base + "/health", timeout=3) as response:
              assert response.status == 200
          request = urllib.request.Request(base + "/v1/system/diagnostics")
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"Expected 401, got {exc.code}"
          else:
              raise AssertionError("Diagnostics exposed without authentication")
          authenticated = urllib.request.Request(base + "/v1/system/diagnostics",
              headers={"Authorization": "Bearer " + os.environ["NEXUS_ACCESS_TOKEN"]})
          with urllib.request.urlopen(authenticated, timeout=3) as response:
              assert response.status == 200
          print("PASS: isolated startup, readiness, health, protected diagnostics")
          PY
      - name: Complete one bounded real public research task
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s python nexus_free_research.py --summary "$RUNNER_TEMP/public-research-summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'public-research-summary.json').read_text())
          assert summary['source_mode'] == 'REAL_PUBLIC_HTTP'
          assert summary['status'] == 'VERIFIED' and summary['tasks_completed'] == 1
          assert summary['supervisor'] == 'accepted' and summary['checkpoint_integrity']
          assert summary['duplicate_execution_prevented'] and summary['http_reads_attempted'] == 2
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### NEXUS bounded public research\n'
                           'VERIFIED: one real-source task, two unauthenticated GETs; '
                           'checkpoint integrity, supervisor and replay checks passed.\n'
                           'CLAIM evidence only; authority HOLD unchanged. '
                           'Ephemeral runner, no persistent production service.\n')
          PY
      - name: Preserve only the non-sensitive research summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-research-summary
          path: ${{ runner.temp }}/public-research-summary.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish failure diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/nexus-startup.log" ]; then
            tail -n 80 "$RUNNER_TEMP/nexus-startup.log" | sed -E 's/(token|password|secret|key)=([^ ]+)/\1=[REDACTED]/Ig'
          fi
