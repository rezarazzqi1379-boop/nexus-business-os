<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ورود به NEXUS</title>
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
  <main class="login-card">
    <div class="mark">N</div>
    <p class="eyebrow">NEXUS BUSINESS OS</p>
    <h1>ورود مالک</h1>
    <p class="hint">رمزی را وارد کنید که هنگام راه‌اندازی برای ورود به کنسول NEXUS انتخاب شده است. رمز را در پیام یا چت ارسال نکنید.</p>
    {{ERROR}}
    <form method="post" action="/auth/login" autocomplete="on">
      <input type="hidden" name="next" value="{{NEXT}}">
      <label>رمز مالک NEXUS<input name="password" type="password" autocomplete="current-password" required minlength="16"></label>
      <button type="submit">ورود به کنسول</button>
    </form>
    <small>نشست حداکثر ۸ ساعت معتبر است؛ خروج یا تغییر رمز آن را باطل می‌کند.</small>
  </main>
</body>
</html>
