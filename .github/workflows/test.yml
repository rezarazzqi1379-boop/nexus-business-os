name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.116,<1" "uvicorn[standard]>=0.35,<1" "pytest>=8,<9" "httpx>=0.28,<1"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run canonical unittest suite
        run: python -m unittest discover -s evals -v

      - name: Run NEXUS failure-derived checks (FM-005..FM-008)
        # pytest-style tests: `unittest discover -s evals` does not collect them.
        run: |
          pytest -q -p no:cacheprovider evals/test_nexus_checks.py
          if [ -d docs/procurement ]; then
            python -m nexus_checks docs/procurement --exclude '*_2026-09-22.md'
          fi

      - name: Run pytest regression suite
        env:
          PYTHONPATH: src
        run: pytest -q tests
