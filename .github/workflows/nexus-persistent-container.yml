name: NEXUS Persistent Container Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/compose.persistent.yml'
      - 'scripts/verify_persistent_container.py'
      - '.github/workflows/nexus-persistent-container.yml'

permissions:
  contents: read

concurrency:
  group: nexus-persistent-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the existing runtime image without publishing it
        timeout-minutes: 8
        run: docker build --tag nexus-persistence-ci:${{ github.sha }} .
      - name: Verify isolated volume, auth, restart, checkpoint and backup recovery
        timeout-minutes: 3
        run: python scripts/verify_persistent_container.py --image nexus-persistence-ci:${{ github.sha }}
